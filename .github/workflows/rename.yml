name: One-shot rename to index.html

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename export to index.html
        run: |
          set -euo pipefail
          git config user.name "nadeem-dev03"
          git config user.email "nadeem-dev03@users.noreply.github.com"
          if [ -f basement-water-damage-orlando.html ]; then
            git mv -f basement-water-damage-orlando.html index.html
            git add -A
            git commit -m "Rename site export to index.html"
            git push origin HEAD:main
          else
            echo "export file not found; nothing to do"
          fi
