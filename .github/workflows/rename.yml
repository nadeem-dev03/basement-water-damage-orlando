name: Rename site export to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename export file to index.html
        run: |
          git config user.name "nadeem-dev03"
          git config user.email "nadeem-dev03@users.noreply.github.com"
          git mv -f basement-water-damage-orlando.html index.html
          git commit -m "Rename site export to index.html"
          git push origin main
